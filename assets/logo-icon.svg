<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4D068" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0B192C" />
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <path d="M 50,5 L 85,20 C 85,60 50,92 50,95 C 50,92 15,60 15,20 Z" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="3" />
  
  <!-- Circuit neural nodes -->
  <circle cx="28" cy="30" r="2.5" fill="#F4D068" />
  <circle cx="72" cy="30" r="2.5" fill="#F4D068" />
  <circle cx="50" cy="80" r="3" fill="#F4D068" />
  <line x1="28" y1="30" x2="35" y2="40" stroke="#F4D068" stroke-width="1.2" opacity="0.6" stroke-dasharray="2 2" />
  <line x1="72" y1="30" x2="65" y2="40" stroke="#F4D068" stroke-width="1.2" opacity="0.6" stroke-dasharray="2 2" />
  <line x1="50" y1="70" x2="50" y2="80" stroke="#F4D068" stroke-width="1.5" opacity="0.8" />

  <!-- Central Pillar of Justice -->
  <line x1="50" y1="26" x2="50" y2="68" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 40,68 L 60,68 L 56,72 L 44,72 Z" fill="url(#goldGrad)" />
  
  <!-- Scale Beam -->
  <line x1="26" y1="36" x2="74" y2="36" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  
  <!-- Left Pan -->
  <line x1="26" y1="36" x2="20" y2="52" stroke="url(#goldGrad)" stroke-width="1.2" />
  <line x1="26" y1="36" x2="32" y2="52" stroke="url(#goldGrad)" stroke-width="1.2" />
  <path d="M 17,52 Q 26,59 35,52 Z" fill="url(#goldGrad)" />

  <!-- Right Pan -->
  <line x1="74" y1="36" x2="68" y2="52" stroke="url(#goldGrad)" stroke-width="1.2" />
  <line x1="74" y1="36" x2="80" y2="52" stroke="url(#goldGrad)" stroke-width="1.2" />
  <path d="M 65,52 Q 74,59 83,52 Z" fill="url(#goldGrad)" />

  <!-- Central Top Finial -->
  <polygon points="50,20 54,26 46,26" fill="url(#goldGrad)" />
</svg>
